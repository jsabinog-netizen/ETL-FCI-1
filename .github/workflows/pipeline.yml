name: Pipeline ELT Colsubsidio

on:
  workflow_dispatch:
  schedule:
    - cron: "20 9 * * *"    # 4:20 COL → antes del refresh BI 5:00
    - cron: "20 12 * * *"   # 7:20 COL → antes de 8:00
    - cron: "20 14 * * *"   # 9:20 COL → antes de 10:00
    - cron: "50 16 * * *"   # 11:50 COL → antes de 12:30
    - cron: "20 18 * * *"   # 13:20 COL → antes de 14:00
    - cron: "20 20 * * *"   # 15:20 COL → antes de 16:00
    - cron: "20 22 * * *"   # 17:20 COL → antes de 18:00
    - cron: "20 0 * * *"    # 19:20 COL → antes de 20:00

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dbt-bigquery

      - name: Crear gcp-credentials.json
        run: |
          cat > gcp-credentials.json << 'CREDENTIAL_EOF'
          ${{ secrets.GCP_CREDENTIALS_JSON }}
          CREDENTIAL_EOF

      - name: Crear profiles.yml de dbt
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          fci_dbt:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: zoho-bq-pipeline-492116
                dataset: colsubsidio_ruta_empresas
                location: US
                keyfile: ${{ github.workspace }}/gcp-credentials.json
                threads: 4
                job_execution_timeout_seconds: 300
                job_retries: 1
                priority: interactive
          EOF

      - name: Extraer y cargar (EL)
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
        run: |
          python extractor.py
          python loader.py

      - name: Transformar (dbt build)
        run: |
          cd fci_dbt
          dbt deps
          dbt build