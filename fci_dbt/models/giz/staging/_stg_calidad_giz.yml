version: 2

models:

  - name: stg_calidad_giz
    description: "Módulo de calidad de datos GIZ. Grano: una fila por revisión de calidad."
    columns:
      - name: id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: estado_calidad
        tests:
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['aprobado', 'rechazado', 'en revisión', 'pendiente']