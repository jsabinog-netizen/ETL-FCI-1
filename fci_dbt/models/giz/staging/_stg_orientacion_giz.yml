version: 2

models:

  - name: stg_orientacion_giz
    description: "Orientación socio-ocupacional. Grano: una fila por sesión de orientación."
    columns:
      - name: id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: documento
        tests:
          - not_null:
              config:
                severity: warn
      - name: orientacion_completada
        tests:
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['true', 'false']