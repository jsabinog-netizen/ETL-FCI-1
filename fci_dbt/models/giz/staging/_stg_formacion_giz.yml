version: 2

models:
  - name: stg_formacion_giz
    columns:
      - name: id
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn

      - name: documento
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn

      - name: nombre_curso
        tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values:
                  - 'técnico en confección'
                  - 'técnico en gastronomía'
                  - 'lengua de señas'
                  - 'intermediación laboral'
                  - 'estrategias comerciales'
              config:
                severity: warn

      - name: formacion_completada
        tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values: ['si', 'no']
              config:
                severity: warn

      - name: validacion_diploma_tecnico
        tests:
          - accepted_values:
              arguments:
                values: ['aprobado', 'rechazo', 'reverificacion']
              config:
                severity: warn

      - name: validacion_diploma_habilidades
        tests:
          - accepted_values:
              arguments:
                values: ['aprobado', 'rechazo', 'reverificacion']
              config:
                severity: warn

      - name: tiene_diploma_tecnico
        tests:
          - accepted_values:
              arguments:
                values: ['si', 'no']
              config:
                severity: warn

      - name: tiene_diploma_blando
        tests:
          - accepted_values:
              arguments:
                values: ['si', 'no']
              config:
                severity: warn

      - name: tiene_certificado_bancario
        tests:
          - accepted_values:
              arguments:
                values: ['si', 'no']
              config:
                severity: warn