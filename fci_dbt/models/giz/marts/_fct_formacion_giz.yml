version: 2

models:
  - name: fct_formacion_giz
    columns:
      - name: documento
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn

      - name: nombre_curso
        tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values:
                  - 'técnico en confección'
                  - 'técnico en gastronomía'
                  - 'lengua de señas'
                  - 'intermediación laboral'
                  - 'estrategias comerciales'
              config:
                severity: warn

      - name: formacion_completada
        tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values: ['si', 'no']
              config:
                severity: warn

      - name: calidad_completa
        tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values: ['si', 'no']
              config:
                severity: warn