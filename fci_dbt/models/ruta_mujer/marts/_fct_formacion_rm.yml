version: 2
models:
- name: fct_formacion_rm
  description: Una fila por registro de inscripción a formación Zoho. Conserva los
    campos de cursos del registro sin multiplicar filas.
  columns:
  - name: id
    tests:
    - unique:
        config:
          severity: warn
    - not_null:
        config:
          severity: warn
  - name: corte
    description: Cohorte del programa (Corte 1 / Corte 2), normalizada a minúsculas en staging. Segmentación transversal del dashboard.
    tests:
      - accepted_values:
          arguments:
            values: ['corte 1', 'corte 2']
          config:
            severity: warn
