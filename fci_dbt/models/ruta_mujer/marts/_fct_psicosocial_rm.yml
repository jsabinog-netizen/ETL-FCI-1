version: 2
models:
  - name: fct_psicosocial_rm
    description: >
      Un diagnóstico psicosocial de Corte 2 por id de Psicosocial_RutaM_v2.
      Incluye ejes (% y puntaje), nivel de riesgo, alertas, barreras y
      llamadas L1/L2. El psicosocial de Corte 1 (v1) no está aquí.
      Los ejes y el riesgo solo existen cuando el diagnóstico está
      diligenciado: usar tiene_diagnostico como denominador en Power BI.
    columns:
      - name: id
        description: Identificador del registro en Zoho.
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: documento
        description: >
          Documento de la participante, tomado de Name. Hoy es único;
          el test avisa si una mujer recibe un segundo diagnóstico.
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: corte_inscripcion
        description: >
          Corte de la inscripción de la mujer. Puede ser 'corte 1' para mujeres
          que siguen en el programa en Corte 2; 'no inscrita' si no tiene inscripción.
      - name: nivel_riesgo_automatico
        tests:
          - accepted_values:
              arguments:
                values: ['bajo', 'moderado', 'alto']
              config:
                severity: warn
      - name: nivel_riesgo_vigente
        description: Riesgo validado por la profesional en L1 si existe; si no, el automático del formulario.
      - name: nivel_riesgo
        description: nivel_riesgo_vigente con prefijo numérico para ordenar ('1. Bajo' … '4. Sin diagnóstico').
        tests:
          - accepted_values:
              arguments:
                values: ['1. Bajo', '2. Moderado', '3. Alto', '4. Sin diagnóstico']
              config:
                severity: warn
      - name: estado_caso
        description: Estado más avanzado del caso (estado final > estado llamada 1 > estado del diagnóstico).
      - name: profesional_que_remite
        description: Orientadora que remitió; es la profesional que se muestra para Corte 2.
      - name: diagnostico_diligenciado
        description: BOOL para medidas. TRUE si estado_del_diagnostico = 'diligenciado'.
      - name: contacto_l1
        description: BOOL. TRUE si la Llamada 1 tuvo contacto efectivo.
      - name: contacto_l2
        description: BOOL. TRUE si la Llamada 2 tuvo contacto efectivo.
      - name: caso_cerrado
        description: BOOL. TRUE si hay estado final del caso.
      - name: psicosocial_completada
        description: BOOL desde el campo Psicosocial_Completado de Zoho.
      - name: tiene_psicosocial_completada
        description: psicosocial_completada en texto (Sí/No).
      - name: reporta_violencia
        description: Violencia familiar, laboral o comunitaria = Sí, o marcó alguna conducta de la pareja (excepto "Ninguna" / "No tengo pareja").
      - name: marca_ideas_autolesivas
        description: Marcó "he pensado que no vale la pena seguir, o he tenido ganas de hacerme daño" en Indicadores de alerta.
      - name: marca_indicadores_emocionales
        description: Marcó cualquier indicador de alerta (excepto "Ninguna" / "Prefiero no responder").
      - name: sin_redes_de_apoyo
        description: Respondió "Ninguna" a cuántas personas cercanas puede pedir ayuda.
      - name: cuidado_afecta_permanencia
        description: Tiene responsabilidades de cuidado y estas dificultan su permanencia ("Sí" o "En ocasiones").
      - name: num_barreras
        description: Número de barreras marcadas (máximo 3).
      - name: barreras_alimentacion_transporte_cuidado
        description: Marcó falta de recursos para alimentación/transporte o falta de apoyo para el cuidado.
      - name: reporta_factores_permanencia
        description: Respondió algún factor que dificultó su permanencia laboral.
      - name: en_tratamiento_psicologico_flag
        description: Está en tratamiento psicológico o psiquiátrico (Sí).
