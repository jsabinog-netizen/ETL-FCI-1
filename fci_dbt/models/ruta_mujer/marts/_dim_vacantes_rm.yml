version: 2
models:
- name: dim_vacantes_rm
  description: Una fila por vacante, enriquecida con empresa por id del lookup; NIT
    como alternativa cuando falta el id.
  columns:
  - name: id
    tests:
    - unique:
        config:
          severity: warn
    - not_null:
        config:
          severity: warn
  - name: corte
    description: Cohorte del programa (Corte 1 / Corte 2), normalizada a minúsculas en staging. Segmentación transversal del dashboard.
    tests:
      - accepted_values:
          arguments:
            values: ['corte 1', 'corte 2']
          config:
            severity: warn
  - name: rango_etario_vacante
    description: Categoría única ordenada de rango etario requerido por la vacante.
  - name: sector_normalizado
    description: Sector de la empresa asociada a la vacante, normalizado a categorías estándar.
  - name: corte_evento
    description: Corte derivado de fecha_de_inicio_de_la_vacante (>= 2026-09-01 -> corte 2, else corte 1).
