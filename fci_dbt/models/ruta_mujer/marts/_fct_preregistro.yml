version: 2
models:
  - name: fct_preregistro_rm
    description: >
      Un preregistro por id de Zoho (grano de evento, no de persona).
      Incluye estado_inscripcion_final, que replica la columna
      "Estado Inscripcion Final" del dashboard de C2M.
      Alimenta la página PREREGISTRO.
    columns:
      - name: id
        description: Identificador del registro en Zoho.
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: documento
        description: >
          Documento de la participante, tomado de Name.
          NO es único: una mujer puede tener varios preregistros.
        tests:
          - not_null:
              config:
                severity: warn
      - name: estado_inscripcion_final
        description: >
          Inscritos si el documento existe en stg_inscripci_n_colsubsidios;
          No aplica si preinscripci_n_completad indica no aplica;
          Pendiente en cualquier otro caso, incluido NULL.
        tests:
          - accepted_values:
              arguments:
                values: ['Inscritos', 'No aplica', 'Pendiente']
              config:
                severity: warn
      - name: se_inscribio
        description: >
          TRUE si el documento del preregistro aparece en el staging
          de inscripción. Base de la medida de conversión preregistro
          a inscripción.
      - name: corte
        description: Cohorte del programa (Corte 1 / Corte 2), normalizada a minúsculas en staging. Segmentación transversal del dashboard.
        tests:
          - accepted_values:
              arguments:
                values: ['corte 1', 'corte 2']
              config:
                severity: warn
      - name: rango_joven
        description: Clasificación de juventud según edad entre 18 y 24 años ('Joven (18-24)' / 'No joven').
      - name: municipio
        description: Municipio clasificado en 'Bogotá', 'Soacha' y 'Otros municipios'.
      - name: tiene_inscripcion
        description: TRUE si la mujer cuenta con registro en Inscripción Colsubsidios.
      - name: tiene_orientacion
        description: TRUE si la mujer cuenta con atención en Orientación Colsubsidios.
      - name: tiene_psicosocial
        description: TRUE si la mujer cuenta con atención en Psicosocial Ruta Mujer.
      - name: tiene_formacion
        description: TRUE si la mujer tiene registros en Formación Colsubsidios.
      - name: tiene_intermediacion
        description: TRUE si la mujer ha tenido intermediaciones laborales.
      - name: tiene_colocacion
        description: TRUE si la mujer cuenta con fecha de vinculación laboral (colocada).
      - name: tiene_postvinculacion
        description: TRUE si la mujer cuenta con seguimiento post-vinculación.
      - name: etapa_actual
        description: Etapa máxima alcanzada en la ruta (0. Solo preregistro, 1. Inscripción, 2. Orientación, etc.).
      - name: siguiente_fase_pendiente
        description: Sugerencia de priorización según la siguiente fase pendiente en la ruta.

