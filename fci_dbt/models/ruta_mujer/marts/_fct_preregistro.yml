version: 2
models:
  - name: fct_preregistro_rm
    description: >
      Un preregistro por id de Zoho (grano de evento, no de persona).
      Incluye estado_inscripcion_final, que replica la columna
      "Estado Inscripcion Final" del dashboard de C2M.
      Alimenta la página PREREGISTRO.
    columns:
      - name: id
        description: Identificador del registro en Zoho.
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: documento
        description: >
          Documento de la participante, tomado de Name.
          NO es único: una mujer puede tener varios preregistros.
        tests:
          - not_null:
              config:
                severity: warn
      - name: estado_inscripcion_final
        description: >
          No aplica si ruta_mujer = 'no aplica', o está empleada formalmente,
          o el sexo es masculino (gana aunque se haya inscrito); Inscritos si
          el documento existe en stg_inscripci_n_colsubsidios; Pendiente en
          cualquier otro caso. sexo está vacío en ~59% de los preregistros,
          así que pueden existir hombres no detectados.
        tests:
          - accepted_values:
              arguments:
                values: ['Inscritos', 'No aplica', 'Pendiente']
              config:
                severity: warn
      - name: motivo_no_aplica
        description: >
          Solo cuando estado_inscripcion_final = 'No aplica': Hombre,
          Empleada formalmente o Marcado No aplica en CRM (primer motivo en
          ese orden). Null en los demás.
        tests:
          - accepted_values:
              arguments:
                values: ['Hombre', 'Empleada formalmente', 'Marcado No aplica en CRM']
              config:
                severity: warn
      - name: ruta_mujer
        description: Campo Ruta_Mujer de Zoho en minúsculas (aplica / no aplica / registrado). Vacío en ~87%.
      - name: se_inscribio
        description: >
          TRUE si el documento del preregistro aparece en el staging
          de inscripción. Base de la medida de conversión preregistro
          a inscripción.
      - name: corte
        description: Cohorte del programa (Corte 1 / Corte 2), normalizada a minúsculas en staging. Segmentación transversal del dashboard.
        tests:
          - accepted_values:
              arguments:
                values: ['corte 1', 'corte 2', 'sin corte']
              config:
                severity: warn
      - name: rango_joven
        description: Agrupación de edad ('18-28', '29-35', '36-45', '46 o más').
      - name: municipio
        description: Municipio clasificado en 'Bogotá', 'Soacha' y 'Otros municipios'.
      - name: tiene_inscripcion
        description: Flag texto ('Sí'/'No') si la participante cuenta con registro en Inscripción Colsubsidios.
      - name: tiene_orientacion
        description: Flag texto ('Sí'/'No') si la participante cuenta con atención en Orientación Colsubsidios.
      - name: tiene_psicosocial
        description: Flag texto ('Sí'/'No') si la participante cuenta con atención en Psicosocial Ruta Mujer.
      - name: tiene_formacion
        description: Flag texto ('Sí'/'No') si la participante tiene registros en Formación Colsubsidios.
      - name: tiene_intermediacion
        description: Flag texto ('Sí'/'No') si la participante ha tenido intermediaciones laborales.
      - name: tiene_colocacion
        description: Flag texto ('Sí'/'No') si la participante cuenta con fecha de vinculación laboral (colocada).
      - name: tiene_postvinculacion
        description: Flag texto ('Sí'/'No') si la participante cuenta con seguimiento post-vinculación.
      - name: etapa_actual
        description: Etapa máxima alcanzada en la ruta (0. Solo preregistro, 1. Inscripción, 2. Orientación, etc.).
      - name: siguiente_fase_pendiente
        description: Sugerencia de priorización según la siguiente fase pendiente en la ruta.

