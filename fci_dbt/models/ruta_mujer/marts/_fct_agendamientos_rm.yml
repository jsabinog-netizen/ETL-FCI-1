version: 2
models:
- name: fct_agendamientos_rm
  description: Una fila por cita. UNION ALL individual/empresarial. Id compuesto con
    tipo para evitar colisiones entre módulos. Fecha de cita en calendario America/Bogota
    y hora local como texto.
  columns:
  - name: id
    tests:
    - unique:
        config:
          severity: warn
    - not_null:
        config:
          severity: warn
  - name: tipo
    tests:
    - accepted_values:
        arguments:
          values:
          - individual
          - empresarial
        config:
          severity: warn
