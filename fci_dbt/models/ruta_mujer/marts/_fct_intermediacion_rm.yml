version: 2
models:
- name: fct_intermediacion_rm
  description: Una fila por evento de intermediación Zoho, sin colapsar eventos por
    mujer.
  columns:
  - name: id
    tests:
    - unique:
        config:
          severity: warn
    - not_null:
        config:
          severity: warn
  - name: corte
    description: Cohorte del programa (Corte 1 / Corte 2), normalizada a minúsculas en staging. Segmentación transversal del dashboard.
    tests:
      - accepted_values:
          arguments:
            values: ['corte 1', 'corte 2']
          config:
            severity: warn
