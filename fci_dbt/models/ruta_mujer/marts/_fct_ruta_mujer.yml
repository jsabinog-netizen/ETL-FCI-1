version: 2
models:
- name: fct_ruta_mujer
  description: Una fila por mujer identificada por documento. Base deduplicada en
    staging. Flags de etapas completadas (si, sí, true); colocada requiere fecha de
    vinculación. Etapa más avanzada completada; formación considera todos sus registros. Documentos vacíos no representan
    una persona identificable y se excluyen.
  columns:
  - name: etapa_actual
    description: >
      Etapa más avanzada completada en el orden Registros, Orientación,
      Atención Psicosocial, Formación, Intermediación, Colocación y
      Postvinculación. No exige completar todas las etapas anteriores.
      Sin completar cuando ningún indicador es verdadero.
    tests:
      - accepted_values:
          arguments:
            values: ['0. Sin completar', '1. Registros', '2. Orientación', '3. Atención Psicosocial', '4. Intermediación', '5. Colocación', '6. Postvinculación']
          config:
            severity: warn
  - name: formada
    description: >
      TRUE si al menos un registro de formación tiene Formaci_n_Completada
      en si/sí/true, aunque exista otro más reciente sin completar.
  - name: postvinculada
    description: >
      TRUE si el seguimiento seleccionado tiene fecha de llamada registrada,
      conforme al criterio de post realizada. Se prioriza el contrato más reciente,
      luego la fecha de llamada, modificación e id.
  - name: tiene_formacion
    description: Versión Sí/No de formada para segmentadores de Power BI.
  - name: tiene_postvinculacion
    description: Versión Sí/No de postvinculada para segmentadores de Power BI.
  - name: fecha_formacion
    description: Fecha de la formación seleccionada, con fecha de curso como alternativa; DATE.
  - name: fecha_postvinculacion
    description: Fecha de llamada del seguimiento seleccionado; DATE.
  - name: formacion_id
    description: Id del registro de formación seleccionado, sin multiplicar mujeres.
  - name: postvinculacion_id
    description: Id del seguimiento seleccionado, sin multiplicar mujeres.
  - name: documento
    tests:
    - unique:
        config:
          severity: warn
    - not_null:
        config:
          severity: warn
  - name: corte
    description: Cohorte del programa (Corte 1 / Corte 2), normalizada a minúsculas en staging. Segmentación transversal del dashboard.
    tests:
      - accepted_values:
          arguments:
            values: ['corte 1', 'corte 2', 'sin corte']
          config:
            severity: warn
  - name: concepto_intermediacion
    description: Concepto de la última intermediación; conserva el mismo evento que estado, intermediador y vacante, incluso si el concepto es nulo.
  - name: rango_etario
    description: Rango de edad de la participante, con prefijo para ordenar la pirámide etaria.
    tests:
      - accepted_values:
          arguments:
            values: ['1. Menor de 18', '2. 18-25', '3. 26-35', '4. 36-45', '5. 46-55', '6. 56 o más', '7. Sin dato']
          config:
            severity: warn

  - name: estado_formacion_mujer
    description: >
      Sin iniciar / Pendiente / Completada. 'Sin iniciar' = la mujer
      no tiene ningún registro en el módulo de formación.
    tests:
      - accepted_values:
          arguments:
            values: ['Sin iniciar', 'Pendiente', 'Completada']
          config:
            severity: warn
  - name: num_registros_formacion
    description: Cantidad de registros de formación de esa mujer. 0 si no tiene.
  - name: alguna_formacion_completada
    description: TRUE si algún registro de formación de la mujer está completado; FALSE si no tiene registros.

  - name: via_de_ingreso
    description: >
      Con preregistro / Registro directo. Identifica las dos puertas
      de entrada al programa. El lookup Pre_registro de Zoho no es
      confiable; el cruce se hace por documento.
    tests:
      - accepted_values:
          arguments:
            values: ['Con preregistro', 'Registro directo']
          config:
            severity: warn
  - name: tuvo_preregistro
    description: TRUE si la mujer tiene registro en Pre_registro_RutaM.
  - name: fecha_inicio_acompanamiento_sc_1
    description: Fecha de inicio del acompañamiento psicosocial de Corte 1 (v1, Sesión Corta 1); DATE.
  - name: fecha_final_acompanamiento_sc_1
    description: Fecha final del acompañamiento psicosocial de Corte 1 (v1, Sesión Corta 1); DATE.
  - name: fecha_atencion_psicosocial
    description: Primera atención psicosocial — Llamada 1 si está en v2, Sesión Corta 1 si está en v1; DATE.
  - name: psicosocial_version
    description: >
      Módulo del que salen los campos psicosociales: 'v2' (Psicosocial_RutaM_v2, Corte 2)
      tiene prioridad sobre 'v1' (Psicosocial_RutaM con corte 1). Null si no tiene psicosocial.
      Los registros de v1 sin corte (cascarones de Corte 2) se ignoran.
  - name: corte_psicosocial
    description: >
      Cohorte de la atención psicosocial según el módulo: v2 = 'corte 2', v1 = 'corte 1'.
      Null si la mujer no tiene registro psicosocial.
    tests:
      - accepted_values:
          arguments:
            values: ['corte 1', 'corte 2']
          config:
            severity: warn
  - name: area_experiencia_normalizada
    description: Sector o área funcional de experiencia laboral previa de la participante, normalizada en categorías homogéneas.
  - name: tiempo_busqueda_empleo
    description: >
      Tiempo que la participante lleva buscando empleo (pregunta '¿Cuánto tiempo lleva buscando empleo?'),
      capturado en la orientación ocupacional (ej. 'menos de un mes', 'de 1 a 2 meses', '3 meses a 5 meses', '6 meses a 12 meses').
  - name: brecha_o_barrera_identificada
    description: Brecha o barrera identificada durante la orientación laboral de la participante.
  - name: profundice_la_barrera_o_brecha_identificada
    description: Detalle o profundización de la brecha o barrera identificada.
  - name: tipo_de_poblacion
    description: >
      Tipo de población general de la participante (campo SAE), priorizando el valor registrado
      en Inscripción Colsubsidios y complementando con Orientación Colsubsidios.
  - name: tipo_de_poblacion_subsidio
    description: Tipo de población asociada a subsidio (proveniente del campo Zoho Tipo de población (Subsidio)).
  - name: estado_civil
    description: Estado civil de la participante (soltero, casado, unión libre, etc.).
  - name: tiene_hijos
    description: Indica si la participante tiene hijos (si/no del campo Zoho).
  - name: es_jefa_hogar_txt
    description: >
      Flag Sí/No para segmentadores de Power BI. Sí cuando es_jefe_hogar = si/sí/true.
    tests:
      - accepted_values:
          arguments:
            values: ['Sí', 'No']
          config:
            severity: warn
  - name: tiene_cuidado_txt
    description: >
      Flag Sí/No para segmentadores de Power BI. Sí cuando la participante tiene
      responsabilidades de cuidado distintas de 'no' o 'ninguna'.
    tests:
      - accepted_values:
          arguments:
            values: ['Sí', 'No']
          config:
            severity: warn
  - name: tiene_hijos_txt
    description: >
      Flag Sí/No para segmentadores de Power BI. Sí cuando tiene_hijos = si/sí/true.
    tests:
      - accepted_values:
          arguments:
            values: ['Sí', 'No']
          config:
            severity: warn
  - name: region_territorial
    description: >
      Jerarquía territorial nivel 1: '1. Bogotá D.C.' si el municipio contiene 'bogotá' o
      la localidad no es nula; '2. Otros Municipios' para el resto.
    tests:
      - accepted_values:
          arguments:
            values: ['1. Bogotá D.C.', '2. Otros Municipios']
          config:
            severity: warn
  - name: subdivision_territorial
    description: >
      Jerarquía territorial nivel 2: la localidad (Suba, Bosa, Kennedy, etc.) para
      Bogotá D.C., o el municipio (Soacha, Funza, Mosquera, etc.) para Otros Municipios.
