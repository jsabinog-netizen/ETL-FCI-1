version: 2
models:
- name: fct_ruta_mujer
  description: Una fila por mujer identificada por documento. Base deduplicada en
    staging. Flags de etapas completadas (si, sí, true); colocada requiere fecha de
    vinculación. Etapa más avanzada del registro reciente. Documentos vacíos no representan
    una persona identificable y se excluyen.
  columns:
  - name: documento
    tests:
    - unique:
        config:
          severity: warn
    - not_null:
        config:
          severity: warn
  - name: corte
    description: Cohorte del programa (Corte 1 / Corte 2), normalizada a minúsculas en staging. Segmentación transversal del dashboard.
    tests:
      - accepted_values:
          arguments:
            values: ['corte 1', 'corte 2']
          config:
            severity: warn
  - name: concepto_intermediacion
    description: Concepto de la última intermediación; conserva el mismo evento que estado, intermediador y vacante, incluso si el concepto es nulo.
  - name: rango_etario
    description: Rango de edad de la participante, con prefijo para ordenar la pirámide etaria.
    tests:
      - accepted_values:
          arguments:
            values: ['1. Menor de 18', '2. 18-25', '3. 26-35', '4. 36-45', '5. 46-55', '6. 56 o más', '7. Sin dato']
          config:
            severity: warn
