version: 2
models:
- name: stg_mitigaci_n_colsubsidios
  description: 'Ruta Mujer: Mitigaci_n_Colsubsidios. Grano: un registro Zoho identificado
    por id.'
  columns:
  - name: id
    tests:
    - unique:
        config:
          severity: warn
    - not_null:
        config:
          severity: warn
  - name: documento
    description: Numero de documento proveniente de Name, conservado como texto. Puede
      repetirse entre eventos.
  - name: modified_time
    description: Modified_Time de Zoho convertido de forma segura a TIMESTAMP.
  - name: corte
    description: Cohorte del programa (Corte 1 / Corte 2), normalizada a minúsculas en staging. Segmentación transversal del dashboard.
