version: 2
models:
- name: stg_inscripci_n_colsubsidios
  description: Inscripción Ruta Mujer. Una fila por documento, deduplicada por fecha
    de registro, modificación, creación e id.
  columns:
  - name: id
    tests:
    - unique:
        config:
          severity: warn
    - not_null:
        config:
          severity: warn
  - name: documento
    description: Documento de Name como texto; una inscripción por documento.
    tests:
    - unique:
        config:
          severity: warn
  - name: modified_time
    description: Modified_Time de Zoho convertido de forma segura a TIMESTAMP.
  - name: corte
    description: Cohorte del programa (Corte 1 / Corte 2), normalizada a minúsculas en staging. Segmentación transversal del dashboard.
