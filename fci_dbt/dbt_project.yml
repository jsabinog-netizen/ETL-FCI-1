name: 'fci_dbt'
version: '1.0.0'

profile: 'fci_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         
  - "target"
  - "dbt_packages"

models:
  fci_dbt:
    colsubsidio:
      staging:
        +materialized: view
      marts:
        +materialized: table
    giz:
      staging:
        +materialized: view
        +schema: proyecto_giz
      marts:
        +materialized: table
        +schema: proyecto_giz
    ruta_mujer:
      staging:
        +materialized: view
        +schema: proyecto_ruta_mujer
      marts:
        +materialized: table
        +schema: proyecto_ruta_mujer

vars:
  # Ruta Mujer — puntaje (% del eje, 0-100) por ENCIMA del cual un eje del
  # diagnóstico psicosocial cuenta como "alerta o necesidad".
  # Provisional: > 0 (acordado 9-oct-2026, pendiente confirmar con psicosocial).
  umbral_eje_psicosocial: 0
